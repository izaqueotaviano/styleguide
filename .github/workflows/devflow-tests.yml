name: DevFlow tests

on:
  push:
    paths:
      - "projetos/devflow/**"
      - ".github/workflows/devflow-tests.yml"
  pull_request:
    paths:
      - "projetos/devflow/**"
      - ".github/workflows/devflow-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projetos/devflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projetos/devflow/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py check --settings=config.settings.test
      - run: python manage.py makemigrations --check --dry-run --settings=config.settings.test
      - run: python manage.py test --settings=config.settings.test
